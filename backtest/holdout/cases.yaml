# Holdout cases (H01-H20): 20 San Francisco Conditional Use cases about food, drink and entertainment premises,
# filed 2022-2025, not among the 40 in ../cases.yaml. Picked and frozen on 2026-11-12, before any rule change, to
# score rule fixes on cases the fixes were not tuned on. Who was eligible and how the 20 were picked: README.md and
# selection.json. 2 did not reach approval (H01-H02, withdrawn) and 18 were decided with a Planning Commission
# motion (H03-H20). Same fields and same rules as ../cases.yaml: `concept_input` is the only text the report gets
# besides the address, taken from the project description with the approval sought, code sections, prior motion
# numbers and the outcome removed, nothing added; where the description lacks a deciding fact, it is left out.
# `concept_as_filed` is the project description on the Planning record, unedited. A withdrawn case is not called a
# failure. `triggers` come from the trigger inventory (triggers.json): two independent readings of each decision
# record (reading-A.json, reading-B.json), settled where they differed. Input facts, record facts and intake answers
# are in inputs.json. `concept_input_edit` records each change made to a neutral text after the audits. No rule,
# report or model had been run on these cases when they were read, settled and frozen.
