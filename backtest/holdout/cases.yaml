    concept_input: "The Nob Hill Masonic Center, an entertainment venue with food and beverage service, operates under an existing permission whose conditions cap events with more than 250 attendees at 79 entertainment events a year, of which at most 54 may be music events. The operator wants the cap on large entertainment events raised from 79 to 91 a year, mostly for comedy shows, and keeps the limit of 54 large music events. No other change."
    concept_as_filed: "In Motion No. 19020, dated November 14, 2013, the Planning Commission approved a conditional use application to change the use of the Nob Hill Masonic Center at 1111 California Street to \"Other Entertainment\" and to authorize food and beverage service within the building. The Commission imposed 50 conditions of approval, including Condition 49 that limits the annual number of music events with more than 250 attendees to 54, and Condition 48 that limits the annual number of entertainment events with more than 250 attendees to 79, including music events. The owner and applicant are filing this application to request a modification to Condition 48 to increase the annual number of large entertainment events from 79 to 91, while retaining the Condition 49 annual limit of 54 large music events. These additional 12 large entertainment events are contemplated to be primarily comedy shows. The owner and application seek no other modification to Motion No. 19020 and its 49 other conditions of approval."
    triggers:
