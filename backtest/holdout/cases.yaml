    why_closed: "The file shows three Incomplete Application Notices on the parent 2024-006665PRJ, dated 30 Aug 2024, 27 Sep 2024 and 18 Dec 2024. They ask for missing plan items and, in the first two, the unpaid Conditional Use fee ($1,998, then $2,869). Each says the project \"will not be assigned to a planner until the items listed in the attached checklist are submitted\" and that after 90 days \"the application may be canceled.\" No hearing, motion, staff report or later correspondence. Status \"Closed - Withdrawn\" 2026-04-13. Most likely closed for never being completed; nothing in the file shows a zoning objection or opposition."
