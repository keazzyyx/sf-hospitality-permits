# Backtest cases: San Francisco Conditional Use cases about food, drink and entertainment premises, filed 2022-2025.
# 25 decided with conditions extracted from the Planning Commission motion (D01-D25) and 15 that did not reach
# approval, withdrawn or cancelled (N01-N15). A withdrawn or cancelled case is not called a failure: `why_closed`
# says what the file shows, and `regulatory_problem` is yes only where the file supports that.
# There is no disapproved hospitality Conditional Use case filed since 2019 in the records (Step 2b), so none is listed.
# The list is not fitted to the tool. `triggers` comes from the trigger inventory (backtest/triggers.json): two
# independent readings of each decision record, settled where they differed, under the code in force at filing.
# `concept_input` is the only text given to the report besides the address: what an operator would know before
# applying (the business, hours, alcohol type, entertainment, outdoor seating, size, chain or not, what the space was
# last used as), taken from the project description with the approval sought, code sections and outcome removed.
# Nothing is added: where the description lacks a deciding fact, the report should say so. `concept_as_filed` is the
# project description on the Planning record, unedited, kept for audit. Nothing has been run.
