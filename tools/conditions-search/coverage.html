<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Coverage</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  window.va("beforeSend", event => ({ ...event, url: String(event.url).split("#")[0] }));
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #1f4e79; --tag: #f1f0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
      --accent: #8fb6dd; --tag: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; overflow-wrap: anywhere; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 28px 0 6px; }
  h3 { font-size: 15px; margin: 20px 0 4px; }
  a { color: var(--accent); }
  .back { font-size: 14px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  code { font-size: 13px; background: var(--tag); padding: 0 4px; border-radius: 4px; }
  li { margin: 3px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; }
  th, td { text-align: left; padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  th { border-top: 0; color: var(--muted); font-weight: 600; }
  td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="./">Back to the search</a></p>
  <h1>Coverage</h1>
  <p class="sub">What the conditions search includes, how the motions were picked, what is left out, and the known gaps.</p>
  <h2>Numbers from the current data</h2>
  <p class="note">Worked out from <code>data/conditions.json</code> as this page loads.</p>
  <div id="facts">Loading…</div>
  <h2 id="reviewed-list">Reviewed list</h2>
  <div id="review">Loading…</div>
  <div id="detail"></div>
</main>
<script type="module">
import { coverageFacts, coverageSentences, day, markdownSection, renderMarkdown } from "./coverage.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = k => (k == null ? "not recorded" : k.toLocaleString("en-US"));

const factsLoaded = fetch("data/conditions.json").then(r => r.json()).then(d => {
  const f = coverageFacts(d);
  const by = Object.entries((d.coverage || {}).motions_by_business || {});
  const rows = [
    ["Cases looked up (decided since " + day(f.since) + ", food or drink under the labels at the time)", n(f.casesLookedUp)],
    ["Motions found", n(f.motionsFound)],
    ["Cases with no motion found", n(f.notFound)],
    ["Kept by the AI classifier (food or drink)", n(f.classifierKept)],
    ["Left out by the AI classifier", n(f.classifierRemoved)],
    ["Added back by the hand review", n(f.addedByReview)],
    ["Removed by the hand review", n(f.removedByReview)],
    ...(f.businessSetByReview ? [["Kept, business type corrected by the hand review", n(f.businessSetByReview)]] : []),
    ["Motions left out in all", n(f.removed)],
    ["Motions kept", n(f.motionsKept)],
    ...by.map(([k, v]) => ["  " + k, n(v)]),
    ["Kept motions with no conditions", n(f.withoutConditions)],
    ["Motions with conditions on the page", n(f.motionsWithConditions)],
    ["Conditions on the page", n(f.conditions)],
    ["Decided", `${day(f.decidedFrom)} to ${day(f.decidedTo)}`],
    ["Conditions that could not be read cleanly", n(f.unreadable)],
    ["Conditions read again by OCR (first reading garbled)", n(f.byOcr)],
    ["Page links that point near the condition, not at it", n(f.nearPage)],
    ["Planning's records copied", f.recordsCopiedOn ? day(f.recordsCopiedOn) : "not recorded"],
    ["Motions looked up", f.lookedUpOn ? day(f.lookedUpOn) : "not recorded"],
    ["Data built", f.builtOn ? day(f.builtOn) : "not recorded"],
  ];
  const notFound = (d.coverage || {}).not_found || [];
  $("facts").innerHTML = `<p>${esc(coverageSentences(d).join(" "))}</p>
    <table><tbody>${rows.map(([k, v]) => `<tr><td>${k.startsWith("  ") ? "&nbsp;&nbsp;&nbsp;&nbsp;" + esc(k.trim()) : esc(k)}</td><td class="n">${esc(v)}</td></tr>`).join("")}</tbody></table>
    ${notFound.length ? `<p class="note">No motion found for: ${notFound.map(m => `${esc(m.record)} (decided ${esc(day(m.decided))}${m.food_or_drink_now ? ", food or drink under the current labels" : ""})`).join("; ")}.</p>` : ""}`;
  const review = d.review || { decisions: [] };
  const decision = r => r.decision === "include" ? `Include${r.business ? " as " + r.business.toLowerCase() : ""}` : "Exclude";
  $("review").innerHTML = review.decisions.length
    ? `<p>An AI classifier decided which motions are about a food, drink or entertainment business. An AI review then
      read each motion${review.reviewed_on ? ` (reviewed ${esc(day(review.reviewed_on))})` : ""} and corrected the
      classifier where it was wrong: "Include" brings a motion it left out back onto the page, "Exclude" takes off one
      it kept, and an "Include" of a motion it already kept can correct its business type. Grocery stores stay
      out (a General or Specialty Grocery use); a Liquor Store use stays in as other food and drink.
      Motions the classifier got right are not listed.</p>
      <table><thead><tr><th>Record</th><th>Address</th><th>What it is</th><th>Decision</th><th>Reason</th></tr></thead><tbody>
      ${review.decisions.map(r => `<tr><td>${esc(r.record)}</td><td>${esc(r.address)}</td><td>${esc(r.what)}</td><td>${esc(decision(r))}</td><td>${esc(r.reason)}</td></tr>`).join("")}
      </tbody></table>`
    : "<p>No motions have been reviewed yet: the classifier's labels are used as they are.</p>";
}).catch(() => { $("review").textContent = ""; $("facts").textContent = "Could not load data/conditions.json: run scripts/validation/build_conditions_index.py first."; });

// The README's Coverage section, plus the sections it points to. (Its "Reviewed list" link goes to the list above,
// built from the data.)
const SECTIONS = ["Coverage", "Text quality", "Motions left out: not food or drink", "Motion PDFs on the public site"];
const detailLoaded = fetch("README.md").then(r => r.text()).then(md => {
  const parts = SECTIONS.map(h => [h, markdownSection(md, h)]).filter(([, body]) => body);
  $("detail").innerHTML = parts.length && parts[0][0] === "Coverage"
    ? parts.map(([h, body]) => `<h2 id="${h.toLowerCase().replace(/[^a-z0-9]+/g, "-")}">${h === "Coverage" ? "Detail" : esc(h)}</h2>${renderMarkdown(body)}`).join("")
      + `<p class="note">From <code>tools/conditions-search/README.md</code>.</p>`
    : "<p>The README has no Coverage section.</p>";
}).catch(() => { $("detail").textContent = "Could not load README.md."; });

// The headings a link can point at (#reviewed-list, the detail sections) are only in place, or only far enough down
// to scroll to, once both parts above have loaded, so jump to the address's target again then.
Promise.allSettled([factsLoaded, detailLoaded]).then(() => {
  const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (target) target.scrollIntoView();
});
</script>
</body>
</html>
