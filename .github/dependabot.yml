# Dependabot version updates: once a month, one grouped pull request per ecosystem, so updates arrive in a batch
# the CI checks in one go. Security updates are separate: with "Dependabot security updates" on in the
# repository's settings they open as soon as an advisory lands, whatever this schedule says.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  # the pnpm workspace (pnpm-lock.yaml at the root: apps/showcase, apps/web, packages/catalog)
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # the current conditions search keeps its own package-lock.json
  - package-ecosystem: npm
    directory: /tools/conditions-search
    schedule: { interval: monthly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # the API's pins (apps/api/requirements-lock.txt)
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
