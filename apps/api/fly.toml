# Fly.io alternative to Railway. Deploy from the repo root:
#   fly launch --no-deploy --copy-config --config apps/api/fly.toml   (first time, pick a name/region)
#   fly secrets set ANTHROPIC_API_KEY=... NEATLOGS_API_KEY=... SUPABASE_URL=... --config apps/api/fly.toml
#   fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --build-arg GIT_SHA=$(git rev-parse --short HEAD)
app = "permit-memo-api"
primary_region = "sjc"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep one machine warm: SSE streams run for minutes
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
