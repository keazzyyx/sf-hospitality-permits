# Railway: create a service from this repo with Root Directory = "/" (repo root) so the
# Docker build context includes packages/catalog. Set the env vars from apps/api/.env.example.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
