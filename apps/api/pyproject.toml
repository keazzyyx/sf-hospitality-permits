[project]
name = "permit-memo-api"
version = "0.1.0"
description = "Permit Memo API: permit fast-track plans for hospitality operators"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=0.60",
  "neatlogs[anthropic]>=1.4",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "stripe>=10.0",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "anyio>=4.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "jsonschema>=4.22",
  "types-jsonschema",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["memo/data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W", "N", "ASYNC", "RUF"]
ignore = ["B008", "RUF012", "E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
ignore_missing_imports = true
exclude = ["tests/"]
# neatlogs ships no type stubs; its @span decorator is otherwise transparent
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["neatlogs", "neatlogs.*", "stripe", "stripe.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
