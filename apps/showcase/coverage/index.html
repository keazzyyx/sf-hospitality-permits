<meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/src/core/favicon.svg">
<script>
  // the theme before first paint: the remembered choice, else the system's (src/core/theme.ts keeps it from here)
  (function () {
    try {
      var t = localStorage.getItem("showcase:theme");
      if (t !== "paper" && t !== "blueprint") t = matchMedia("(prefers-color-scheme: dark)").matches ? "blueprint" : "paper";
      document.documentElement.dataset.theme = t;
      // the browser's own chrome takes the ground colour of the theme in use
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", t === "paper" ? "#f2ede1" : "#0a0f1f");
    } catch (e) {}
  })();
</script>
