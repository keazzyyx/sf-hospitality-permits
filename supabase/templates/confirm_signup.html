<h2>Confirm your email to start with Permit Memo</h2>

<p>Open this link on any device to confirm your email and sign in. It expires in an hour and works once.</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}">Confirm and sign in</a></p>

<p>Or enter this code on the sign-in page:</p>
<p style="font-size: 28px; letter-spacing: 6px; font-family: ui-monospace, Menlo, monospace;"><strong>{{ .Token }}</strong></p>

<p>If you did not request this, you can ignore this email.</p>
